# goreleaser config for the Workshop binary. Pure Go (CGO off) — one Linux
# runner cross-compiles every target. Run from the workshop/ directory.
version: 2

project_name: workshop

builds:
  - main: ./cmd/workshop
    binary: workshop
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  filters:
    exclude:
      - "^docs"
      - "^test"

release:
  draft: false
