# goreleaser config for the Workshop binary. Pure Go (CGO off) — one Linux
# runner cross-compiles every target. Run from the workshop/ directory.
version: 2

project_name: workshop

builds:
  - main: ./cmd/workshop
    binary: workshop
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  filters:
    exclude:
      - "^docs"
      - "^test"

release:
  draft: false

# deb/rpm attach straight to the GitHub release — no external repo needed.
# (Homebrew tap / Scoop bucket publishing needs tap/bucket repos plus a token;
# create those before wiring brews:/scoops: here.)
nfpms:
  - package_name: workshop
    formats: [deb, rpm]
    maintainer: PurplePotassium <noreply@github.com>
    description: Autonomous coding-agent loops with a live dashboard.
    homepage: https://github.com/PurplePotassium/cosmic-agent-tools
    license: MIT
    bindir: /usr/bin
    dependencies:
      - git
