name: ci

on:
  push:
    branches: [main]
    paths: ["workshop/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["workshop/**", ".github/workflows/ci.yml"]

jobs:
  test:
    strategy:
      matrix:
        # macOS matters: the Unix PID-liveness fallback is weakest on darwin,
        # so it must at least be exercised by the suite.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workshop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workshop/go.mod
          cache-dependency-path: workshop/go.sum
      - name: git identity for test repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@workshop.local
      - run: go vet ./...
      - name: test (race on unix)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: test
        if: runner.os == 'Windows'
        run: go test ./...
      # Windows is the primary dev platform but the full suite under -race is
      # slow there; cover the packages with real cross-goroutine mutation
      # (app config reloads, server handlers, store writers, bus fan-out).
      # windows-latest ships mingw gcc, which -race needs.
      - name: race (windows, concurrency-heavy packages)
        if: runner.os == 'Windows'
        run: go test -race ./internal/app/... ./internal/server/... ./internal/store/... ./internal/bus/...
        env:
          CGO_ENABLED: 1
      # The e2e suite is the orchestrator-level proof (README calls it the
      # gate's teeth): it builds the REAL binary and drives it against
      # scaffolded repos. Hermetic — temp state dirs, fake driver only.
      - name: e2e
        run: go test -tags e2e -timeout 10m ./e2e
      - run: go build ./cmd/workshop

  # golangci-lint runs CI-only (kept out of the self-hosting pre-commit gate
  # per the README rationale). The config lives in workshop/.golangci.yml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workshop/go.mod
          cache-dependency-path: workshop/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: workshop

  # A broken .goreleaser.yaml otherwise only surfaces at the first tag.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workshop/go.mod
          cache-dependency-path: workshop/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
          workdir: workshop
